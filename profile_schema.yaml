$schema: "https://json-schema.org/draft/2020-12/schema"
title: MyCS profile
type: object
required: [profile]
additionalProperties: false
properties:
  profile:
    type: object
    required:
      - id
      - identity
      - education
      - skills
      - interests
      - target_roles
      - career_trajectory
      - internship_preferences
      - learning_priorities
      - languages
      - mobility
      - availability
      - career_scout
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      identity:
        type: object
        required: [first_name, last_name, country, city]
        additionalProperties: false
        properties:
          first_name: {$ref: "#/$defs/non_empty_string"}
          last_name: {$ref: "#/$defs/non_empty_string"}
          country: {$ref: "#/$defs/non_empty_string"}
          city: {$ref: "#/$defs/non_empty_string"}
      education:
        type: object
        required: [current, previous]
        additionalProperties: false
        properties:
          current: {$ref: "#/$defs/education"}
          previous:
            type: array
            items: {$ref: "#/$defs/education"}
      academic_profile:
        type: object
        required: [fields, strengths]
        additionalProperties: false
        properties:
          fields: {$ref: "#/$defs/string_list"}
          strengths: {$ref: "#/$defs/string_list"}
      skills:
        type: object
        minProperties: 1
        additionalProperties:
          type: array
          items: {$ref: "#/$defs/skill"}
      experience:
        type: array
        items: {$ref: "#/$defs/experience"}
      projects:
        type: array
        items: {$ref: "#/$defs/project"}
      interests:
        type: object
        required: [technical, scientific, long_term]
        additionalProperties: false
        properties:
          technical: {$ref: "#/$defs/string_list"}
          scientific: {$ref: "#/$defs/string_list"}
          long_term: {$ref: "#/$defs/string_list"}
      target_roles:
        type: object
        required: [preferred, strong, acceptable]
        additionalProperties: false
        properties:
          preferred: {$ref: "#/$defs/role_list"}
          strong: {$ref: "#/$defs/role_list"}
          acceptable: {$ref: "#/$defs/role_list"}
      career_trajectory:
        type: object
        required: [current, next, medium_term, long_term, objective]
        additionalProperties: false
        properties:
          current: {$ref: "#/$defs/string_list"}
          next: {$ref: "#/$defs/string_list"}
          medium_term: {$ref: "#/$defs/string_list"}
          long_term: {$ref: "#/$defs/string_list"}
          objective: {$ref: "#/$defs/non_empty_string"}
      internship_preferences: {$ref: "#/$defs/internship_preferences"}
      opportunity_preferences:
        type: object
        required: [highly_valued, career_value, avoid_or_deprioritize]
        additionalProperties: false
        properties:
          highly_valued: {$ref: "#/$defs/string_list"}
          career_value:
            type: object
            additionalProperties: {type: integer, minimum: 1, maximum: 5}
          avoid_or_deprioritize: {$ref: "#/$defs/string_list"}
      learning_priorities:
        type: object
        required: [high, medium, future]
        additionalProperties: false
        properties:
          high: {$ref: "#/$defs/string_list"}
          medium: {$ref: "#/$defs/string_list"}
          future: {$ref: "#/$defs/string_list"}
      languages:
        type: array
        minItems: 1
        items:
          type: object
          required: [name, level]
          additionalProperties: false
          properties:
            name: {$ref: "#/$defs/non_empty_string"}
            level: {$ref: "#/$defs/non_empty_string"}
            objective: {type: string}
      mobility:
        type: object
        required: [willing_to_travel, willing_to_relocate, international_mobility, priority]
        additionalProperties: false
        properties:
          willing_to_travel: {type: boolean}
          willing_to_relocate: {type: boolean}
          international_mobility: {type: boolean}
          priority: {enum: [low, medium, high]}
      availability:
        type: object
        required: [internship]
        additionalProperties: false
        properties:
          internship: {$ref: "#/$defs/period"}
      career_preferences:
        type: object
        required: [wants, long_term_goal]
        additionalProperties: false
        properties:
          wants: {$ref: "#/$defs/string_list"}
          long_term_goal: {$ref: "#/$defs/non_empty_string"}
      career_scout:
        type: object
        required: [search_frequency, notify_new_high_match, minimum_match_score, minimum_trajectory_score, prioritize_deadlines, detect_funding, detect_skill_gaps, suggest_learning_resources, user_approval_required_for_applications]
        additionalProperties: false
        properties:
          search_frequency: {enum: [daily, weekly, monthly]}
          notify_new_high_match: {type: boolean}
          minimum_match_score: {$ref: "#/$defs/score"}
          minimum_trajectory_score: {$ref: "#/$defs/score"}
          prioritize_deadlines: {type: boolean}
          detect_funding: {type: boolean}
          detect_skill_gaps: {type: boolean}
          suggest_learning_resources: {type: boolean}
          user_approval_required_for_applications: {type: boolean}
$defs:
  non_empty_string: {type: string, minLength: 1}
  string_list:
    type: array
    items: {$ref: "#/$defs/non_empty_string"}
  score: {type: integer, minimum: 0, maximum: 100}
  period:
    type: object
    required: [start, end, duration_months]
    additionalProperties: false
    properties:
      start: {type: string, format: date}
      end: {type: string, format: date}
      duration_months: {type: integer, minimum: 1, maximum: 24}
  education:
    type: object
    required: [institution, program, status]
    additionalProperties: false
    properties:
      institution: {$ref: "#/$defs/non_empty_string"}
      university: {type: string}
      program: {$ref: "#/$defs/non_empty_string"}
      specialization: {type: string}
      level: {type: string}
      track: {type: string}
      years: {$ref: "#/$defs/string_list"}
      status: {$ref: "#/$defs/non_empty_string"}
  skill:
    type: object
    required: [name, level, level_score, status]
    additionalProperties: false
    properties:
      name: {$ref: "#/$defs/non_empty_string"}
      level: {$ref: "#/$defs/non_empty_string"}
      level_score: {type: integer, minimum: 0, maximum: 3}
      status: {enum: [active, learning, planned, not_started]}
  experience:
    type: object
    required: [title, organization, country, city, type, domain, activities, technologies]
    additionalProperties: false
    properties:
      title: {$ref: "#/$defs/non_empty_string"}
      organization: {$ref: "#/$defs/non_empty_string"}
      acronym: {type: string}
      country: {$ref: "#/$defs/non_empty_string"}
      city: {$ref: "#/$defs/non_empty_string"}
      type: {$ref: "#/$defs/non_empty_string"}
      domain: {$ref: "#/$defs/string_list"}
      activities: {$ref: "#/$defs/string_list"}
      technologies: {$ref: "#/$defs/string_list"}
  project:
    type: object
    required: [name, type, status, description, domains]
    additionalProperties: false
    properties:
      name: {$ref: "#/$defs/non_empty_string"}
      type: {$ref: "#/$defs/non_empty_string"}
      status: {$ref: "#/$defs/non_empty_string"}
      description: {$ref: "#/$defs/non_empty_string"}
      domains: {$ref: "#/$defs/string_list"}
      technologies: {$ref: "#/$defs/string_list"}
      future_technologies: {$ref: "#/$defs/string_list"}
  role_list:
    type: array
    items:
      type: object
      required: [role, priority]
      additionalProperties: false
      properties:
        role: {$ref: "#/$defs/non_empty_string"}
        priority: {type: integer, minimum: 1, maximum: 5}
  internship_preferences:
    type: object
    required: [target_period, geographic_priority, work_modes, funding, opportunity_types]
    additionalProperties: false
    properties:
      target_period: {$ref: "#/$defs/period"}
      geographic_priority:
        type: object
        required: [tier_1, tier_2, tier_3, tier_4, preferred_country, other]
        additionalProperties: false
        properties:
          tier_1: {$ref: "#/$defs/string_list"}
          tier_2: {$ref: "#/$defs/string_list"}
          tier_3: {$ref: "#/$defs/string_list"}
          tier_4: {$ref: "#/$defs/string_list"}
          preferred_country: {$ref: "#/$defs/string_list"}
          other: {$ref: "#/$defs/string_list"}
      work_modes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [onsite, hybrid, remote]}
      funding:
        type: object
        required: [strongly_preferred, acceptable]
        additionalProperties: false
        properties:
          strongly_preferred: {$ref: "#/$defs/string_list"}
          acceptable: {$ref: "#/$defs/string_list"}
      opportunity_types: {$ref: "#/$defs/string_list"}
